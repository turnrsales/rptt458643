<script>
	let currentIndex2 = 0;
	const items2 = document.querySelectorAll('.carousel-2 .carousel-item');
	const indicators2 = document.querySelectorAll('.carousel-2 .carousel-indicators li');
	const prevButton2 = document.querySelector('.carousel-2 .prev');
	const nextButton2 = document.querySelector('.carousel-2 .next');

	function showItem2(index) {
		items2.forEach(item => item.classList.remove('active'));
		indicators2.forEach(indicator => indicator.classList.remove('active'));

		items2[index].classList.add('active');
		indicators2[index].classList.add('active');

		const carouselInner2 = document.querySelector('.carousel-2 .carousel-inner');
		carouselInner2.style.transition = 'transform 1s ease-in-out';
		carouselInner2.style.transform = `translateX(-${index * 100}%)`;
	}

	nextButton2.addEventListener('click', () => {
		currentIndex2 = (currentIndex2 + 1) % items2.length;
		showItem2(currentIndex2);
	});

	prevButton2.addEventListener('click', () => {
		currentIndex2 = (currentIndex2 - 1 + items2.length) % items2.length;
		showItem2(currentIndex2);
	});

	indicators2.forEach((indicator2, index) => {
		indicator2.addEventListener('click', () => {
			currentIndex2 = index;
			showItem2(currentIndex2);
		});
	});

	setInterval(() => {
		currentIndex2 = (currentIndex2 + 1) % items2.length;
		showItem2(currentIndex2);
	}, 5000);

	showItem2(currentIndex2);
</script>

<script>
                        $(function () {

                            /* Start code to load js and css files properly on local server or production server: NOte: this is the workwround, need to fix this */
                            loadHeaderFooter("header", "/media/projects/testcl/testpro/header.html");
                            loadHeaderFooter("footer", "/media/projects/testcl/testpro/footer.html");
                            /*  End code */


                            /*  Start code to load js and css files properly on Githubpages  */
                            loadHeaderFooter("header", "header.html");
                            loadHeaderFooter("footer", "footer.html");
                            /* End code */

                            function getCurrentFile() {
                                let file = new URLSearchParams(location.search).get("srcReq")
                                    || location.pathname.split("/").pop()
                                    || "index.html";

                                if (!file.includes(".")) file += ".html";

                                return file.toLowerCase();
                            }

                            function loadHeaderFooter(id, file) {
                                $("#" + id).load(file, function (_, status) {
                                    if (status === "error") return;
                                    const targetid = $("#" + id);
                                    targetid.find("a").addClass("edit-site");
                                    if (id !== "header") return;
                                    let current = getCurrentFile();

                                    // Show / hide sections
                                    targetid.find(".main-header-section").toggle(current === "index.html");
                                    targetid.find(".header-breadcrumb-section").toggle(current !== "index.html");
                                    // Match page name
                                    let name = "";
                                    targetid.find(".main-navigation a").each(function () {
                                        let href = ($(this).attr("href") || "").split("/").pop().toLowerCase();
                                        if (href === current) name = $(this).text().trim();
                                    });

                                    // Apply name (fallback safe)
                                    targetid.find(".Page_name").text(
                                        name || current.replace(".html", "").replace(/_/g, " ")
                                    );
                                });
                            }

                        });
                    </script>
